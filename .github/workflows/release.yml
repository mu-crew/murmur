name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Seconds, no install: a tag that does not match package.json fails before
  # the full gate runs.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: Check release version
        run: node scripts/check-release-version.mjs "${{ github.ref_name }}"

  # The same gate as PRs and main, run against the tagged commit.
  check:
    needs: version
    uses: ./.github/workflows/check.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    # id-token: npm trusted publishing. No npm token is stored anywhere; npmjs.com
    # trusts this repo's release.yml for @mu-crew/murmur.
    permissions:
      contents: write # the GitHub release
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      # prepare builds dist/, which npm publish ships.
      - run: npm ci
      # Trusted publishing (OIDC) needs npm 11.5.1+; older npm fails with a
      # misleading 404.
      - run: npm install -g npm@^11.5.1
      - name: Publish
        run: npm publish --access public
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/changelog-section.py CHANGELOG.md "$version" > notes.md
          gh release create "$GITHUB_REF_NAME" --title "murmur $version" --notes-file notes.md --verify-tag
