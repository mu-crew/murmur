name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # id-token: npm trusted publishing. No npm token is stored anywhere; npmjs.com
    # trusts this repo's release.yml for @mu-crew/murmur.
    permissions:
      contents: write # the GitHub release
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check release version
        run: node scripts/check-release-version.mjs "${{ github.ref_name }}"
      # zsh: one tmux-rig test runs the remote jump hook through a real zsh.
      - run: sudo apt-get update && sudo apt-get install -y tmux zsh
      # prepare installs git hooks into the checkout; harmless in CI.
      - run: npm ci
      - run: npm run check
      # Trusted publishing (OIDC) needs npm 11.5.1+; older npm fails with a
      # misleading 404.
      - run: npm install -g npm@^11.5.1
      - name: Publish
        run: npm publish --access public
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/changelog-section.py CHANGELOG.md "$version" > notes.md
          gh release create "$GITHUB_REF_NAME" --title "murmur $version" --notes-file notes.md --verify-tag
